{% extends 'base.html' %}

{% block content %}
  <div class="login-centered">
    <div class="login-card-centered card">
      <div class="login-card-inner">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">Sign In</h2>
          <a href="/register" class="btn" style="font-size:0.95rem;padding:6px 10px">Create account</a>
        </div>
        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}
  <form method="post" action="/login" class="login-form" style="margin-top:12px">
          <label>Email</label>
          <input type="email" name="email" placeholder="you@example.com" required />

          <label>Password</label>
          <div style="position: relative; display: flex; align-items: center;">
            <input type="password" name="password" id="password" placeholder="Password" required style="flex: 1; padding-right: 35px;" />
            <button type="button" id="togglePassword" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: #666;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <script>
            const passwordInput = document.getElementById('password');
            const toggleButton = document.getElementById('togglePassword');
            toggleButton.addEventListener('click', function(e) {
              e.preventDefault();
              if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
              } else {
                passwordInput.type = 'password';
              }
            });
          </script>

          <div class="form-actions">
            <button class="btn primary" type="submit">Sign In</button>
          </div>
        </form>
        <div style="margin-top:12px">
          <a href="/forgot">Forgot password?</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
