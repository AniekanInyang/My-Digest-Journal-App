{% extends 'base.html' %}

{% block content %}
  <form class="entry-form" method="post" action="{% if entry %}/edit/{{ entry.id }}{% else %}/new{% endif %}">
    <label>Date</label>
    <div style="position: relative; display: flex; align-items: center;">
      <input 
        type="text" 
        id="dateInput" 
        placeholder="Select date" 
        readonly 
        style="flex: 1; cursor: pointer; padding-right: 40px;" 
      />
      <input type="hidden" name="entry_date" id="entryDate" />
      <button type="button" id="calendarBtn" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; color: #666;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>
    </div>

    <!-- Calendar Popup -->
    <div id="calendarPopup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 16px; padding: 0; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 1000; width: 90%; max-width: 380px; overflow: hidden;">
      <!-- Header with gradient -->
      <div style="background: linear-gradient(135deg, #b19cd9 0%, #9d7ec8 100%); padding: 24px; color: white; text-align: center;">
        <h3 style="margin: 0; font-size: 24px; font-weight: 600;">My Journal</h3>
      </div>

      <!-- Month/Year selectors -->
      <div style="padding: 20px; background: #f9f9f9; border-bottom: 1px solid #eee;">
        <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
          <select id="monthSelect" style="padding: 8px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer;">
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
          </select>
          <select id="yearSelect" style="padding: 8px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; max-height: 300px;"></select>
        </div>
      </div>

      <!-- Calendar Grid -->
      <div style="padding: 20px;">
        <!-- Day headers -->
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 12px; text-align: center;">
          <div style="font-weight: 600; color: #999; font-size: 12px; padding: 8px 0;">Mo</div>
          <div style="font-weight: 600; color: #999; font-size: 12px; padding: 8px 0;">Tu</div>
          <div style="font-weight: 600; color: #999; font-size: 12px; padding: 8px 0;">We</div>
          <div style="font-weight: 600; color: #999; font-size: 12px; padding: 8px 0;">Th</div>
          <div style="font-weight: 600; color: #999; font-size: 12px; padding: 8px 0;">Fr</div>
          <div style="font-weight: 600; color: #999; font-size: 12px; padding: 8px 0;">Sa</div>
          <div style="font-weight: 600; color: #999; font-size: 12px; padding: 8px 0;">Su</div>
        </div>

        <!-- Calendar days -->
        <div id="calendarDays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center;"></div>
      </div>

      <!-- Action buttons -->
      <div style="padding: 16px 20px; border-top: 1px solid #eee; background: #f9f9f9; display: flex; gap: 10px; justify-content: flex-end;">
        <button type="button" id="closeCalendar" style="padding: 6px 14px; font-size: 13px; background-color: transparent; color: #999; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; transition: all 0.2s ease;" onmouseover="this.style.backgroundColor='#f5f5f5'; this.style.color='#666';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#999';">Cancel</button>
      </div>
    </div>

    <!-- Overlay for calendar -->
    <div id="calendarOverlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 999;" onclick="document.getElementById('closeCalendar').click()"></div>

    <label>Title</label>
    <input name="title" type="text" placeholder="Entry title" value="{{ entry.title if entry else '' }}" />

    <label>Content</label>
    <textarea name="content" rows="8" placeholder="Write your thoughts...">{{ entry.content if entry else '' }}</textarea>

    <div class="form-actions">
      <button class="btn primary" type="submit">Save Entry</button>
      <a class="btn" href="/">Cancel</a>
    </div>
  </form>

  <script>
    let currentDate = new Date();
    
    function formatDate(date) {
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function initializeYearDropdown() {
      const yearSelect = document.getElementById('yearSelect');
      const currentYear = new Date().getFullYear();
      
      // Clear existing options
      yearSelect.innerHTML = '';
      
      // Add years from current year down to 20 years ago
      for (let i = 0; i <= 20; i++) {
        const year = currentYear - i;
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
      }
    }

    function renderCalendar() {
      const year = parseInt(document.getElementById('yearSelect').value);
      const month = parseInt(document.getElementById('monthSelect').value);
      
      currentDate.setFullYear(year);
      currentDate.setMonth(month);
      
      // Get first day of month and number of days
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = (firstDay.getDay() + 6) % 7; // Convert Sunday=0 to Monday=0
      
      let html = '';
      
      // Empty cells for days before month starts
      for (let i = 0; i < startingDayOfWeek; i++) {
        html += '<div style="padding: 12px 0;"></div>';
      }
      
      // Days of month
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const selectedDateStr = document.getElementById('entryDate').value;
      
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = date.toISOString().split('T')[0];
        const isToday = date.getTime() === today.getTime();
        const isSelected = selectedDateStr === dateStr;
        
        let style = 'padding: 12px 0; cursor: pointer; border-radius: 50%; font-size: 14px; font-weight: 500; ';
        
        if (isSelected) {
          style += 'background-color: #b19cd9; color: white; font-weight: 600;';
        } else if (isToday) {
          style += 'background-color: #e8ddf7; color: #333; font-weight: 600;';
        } else {
          style += 'color: #333;';
        }
        
        html += `<div style="${style}" onclick="selectDate(${day})" onmouseover="this.style.backgroundColor='#f0e6ff'" onmouseout="${isSelected ? "this.style.backgroundColor='#b19cd9'" : (isToday ? "this.style.backgroundColor='#e8ddf7'" : "this.style.backgroundColor='transparent'")}">${day}</div>`;
      }
      
      document.getElementById('calendarDays').innerHTML = html;
    }

    function selectDate(day) {
      const year = parseInt(document.getElementById('yearSelect').value);
      const month = parseInt(document.getElementById('monthSelect').value);
      const selectedDate = new Date(year, month, day);
      const dateString = selectedDate.toISOString().split('T')[0];
      
      document.getElementById('entryDate').value = dateString;
      document.getElementById('dateInput').value = formatDate(selectedDate);
      
      // Close calendar
      document.getElementById('calendarPopup').style.display = 'none';
      document.getElementById('calendarOverlay').style.display = 'none';
    }

    // Calendar controls
    document.getElementById('calendarBtn').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('calendarPopup').style.display = 'block';
      document.getElementById('calendarOverlay').style.display = 'block';
      renderCalendar();
    });

    document.getElementById('closeCalendar').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('calendarPopup').style.display = 'none';
      document.getElementById('calendarOverlay').style.display = 'none';
    });

    document.getElementById('monthSelect').addEventListener('change', function() {
      renderCalendar();
    });

    document.getElementById('yearSelect').addEventListener('change', function() {
      renderCalendar();
    });

    // Initialize and set today as default on page load
    window.addEventListener('load', function() {
      initializeYearDropdown();
      
      const today = new Date();
      document.getElementById('monthSelect').value = today.getMonth();
      document.getElementById('yearSelect').value = today.getFullYear();
      document.getElementById('entryDate').value = today.toISOString().split('T')[0];
      document.getElementById('dateInput').value = formatDate(today);
    });
  </script>
{% endblock %}
